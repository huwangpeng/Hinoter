<title>Hinoter · 华为笔记工具集</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1d2129;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  header { text-align: center; margin-bottom: 40px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
  header p { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  header .icon { font-size: 48px; margin-bottom: 12px; }
  .cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 680px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    width: 300px;
    text-decoration: none;
    color: var(--ink);
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,.08);
    border-color: var(--accent);
  }
  .card .emoji { font-size: 40px; margin-bottom: 16px; }
  .card h2 { font-size: 18px; font-weight: 600; }
  .card p { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .card .tag {
    display: inline-block;
    margin-top: 14px;
    padding: 4px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
  }

  footer {
    margin-top: 48px;
    padding: 24px 16px 8px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 720px;
  }
  .footer-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    line-height: 1.8;
  }
  .footer-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    transition: color .15s ease;
  }
  .footer-link:hover { color: var(--accent); }
  .footer-link svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
  .footer-dot { opacity: .45; }
  @media (max-width: 640px) {
    .card { width: 100%; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
